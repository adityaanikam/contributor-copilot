[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contributor-copilot"
version = "0.1.0"
description = "Answers questions about an open source repo and cites the exact file or issue."
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.7",
    "langchain-text-splitters>=1.1",
    "langchain-ollama>=1.1",
    "langgraph>=1.2",
    "ollama>=0.4",
    "httpx>=0.27",
    "chromadb>=1.5",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Embedding and reranker models. Pulls in PyTorch.
models = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["contributor_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
